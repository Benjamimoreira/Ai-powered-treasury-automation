name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  # Permite correr o deploy à mão (separador Actions > CI/CD > Run workflow).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Correr testes
        run: pytest -v

  # Faz o build das 3 imagens e publica-as no GitHub Container Registry
  # (ghcr.io/<dono>/<repo>/<nome>:latest e :<sha>). Em pull requests só faz
  # o build (sem push), para validar que o Dockerfile continua a funcionar.
  build-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      prefix: ${{ steps.prefix.outputs.prefix }}
    strategy:
      matrix:
        include:
          - name: api
            context: .
          - name: db
            context: ./docker/db
          - name: log-archiver
            context: ./docker/log-archiver
          - name: faturas-ocr
            context: ./docker/faturas-ocr
    steps:
      - uses: actions/checkout@v4
      - name: Prefixo das imagens (tem de ser minúsculas)
        id: prefix
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prefix.outputs.prefix }}/${{ matrix.name }}:latest
            ${{ steps.prefix.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Corre na máquina de destino (runner self-hosted instalado lá - ver
  # README, "Deploy noutra máquina"). Não faz build: só puxa as imagens
  # publicadas acima e reinicia os containers. O .env fica na pasta de
  # trabalho do runner (não é apagado por causa de clean: false).
  deploy:
    runs-on: self-hosted
    needs: build-push
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    env:
      IMAGE_PREFIX: ${{ needs.build-push.outputs.prefix }}
      IMAGE_TAG: ${{ github.sha }}
    # cmd em vez do PowerShell por omissão: sem pwsh instalado o runner cai
    # no Windows PowerShell 5.1, que trata o progresso que o docker escreve
    # no stderr como erro (o passo falhava com exit code 1 e sem mensagem).
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnóstico
        run: |
          whoami
          where docker
          docker version --format "cliente {{.Client.Version}} / servidor {{.Server.Version}}"
          docker compose version
          if not exist .env (echo ERRO: falta o .env em %CD% - ver README, "Deploy noutra maquina" & exit /b 1)
          docker compose config --quiet
      - name: Puxar imagens novas
        run: docker compose pull --quiet
      # Porta de qualidade do LLM: corre o conjunto de avaliação dos casos
      # ambíguos (evals/ambiguos.json) DENTRO da imagem nova, contra o Ollama
      # desta máquina, antes de reiniciar os containers - se a exatidão ficar
      # abaixo do limiar, o passo falha e os containers antigos continuam a
      # correr. Só corre quando muda algo que afeta o LLM (ou em Run
      # workflow; também quando mudam requirements/Dockerfile/este ficheiro):
      # são ~30 chamadas ao modelo local, ~15-20 minutos em CPU.
      # Corre aqui e não nos servidores do GitHub porque o modelo é local
      # (os dados não saem da máquina). Ver docs/AVALIACAO_LLM.md.
      - name: Mudou algo que afeta o LLM?
        id: mudou
        run: |
          if "${{ github.event_name }}"=="workflow_dispatch" (echo correr=true>>%GITHUB_OUTPUT% & exit /b 0)
          rem safe.directory: o runner corre como "Servico de rede" e a pasta de
          rem trabalho pode pertencer a outra conta - sem isto o git recusa
          rem ("dubious ownership"), a lista fica vazia e a avaliacao era saltada
          git -c safe.directory=* diff --name-only ${{ github.event.before }} HEAD > alterados.txt || git -c safe.directory=* diff --name-only HEAD~1 HEAD > alterados.txt
          echo Ficheiros alterados: & type alterados.txt
          findstr /R /C:"^app/services/llm_resolver\.py" /C:"^app/services/llm_tracing\.py" /C:"^app/services/agente_ambiguos\.py" /C:"^app/services/resolucao_regras\.py" /C:"^app/services/rag_historico\.py" /C:"^app/services/indice_vetorial\.py" /C:"^app/evals/" /C:"^evals/ambiguos\.json" /C:"^evals/recuperacao\.json" /C:"^requirements\.txt" /C:"^Dockerfile" /C:"^\.github/workflows/ci\.yml" alterados.txt >nul && (echo correr=true>>%GITHUB_OUTPUT%) || (echo correr=false>>%GITHUB_OUTPUT% & echo Nada que afete o LLM mudou - avaliacao nao corre.)
          exit /b 0
      # Porta de qualidade da recuperação (RAG): recall@6 do método em produção
      # sobre evals/recuperacao.json (~1300 consultas reais pseudonimizadas).
      # Não chama o LLM - corre em ~1 minuto. Ver docs/AVALIACAO_LLM.md, "Recuperação".
      - name: Porta de qualidade da recuperação (sem LLM, imagem nova)
        if: steps.mudou.outputs.correr == 'true'
        timeout-minutes: 15
        env:
          LIMIAR_RECALL: "0.75"
        run: docker run --rm %IMAGE_PREFIX%/api:%IMAGE_TAG% python -m app.evals.avaliar_recuperacao --metodos recencia denso --limiar-recall %LIMIAR_RECALL%
      - name: Porta de qualidade do LLM (Ollama local, imagem nova)
        if: steps.mudou.outputs.correr == 'true'
        timeout-minutes: 90
        env:
          LIMIAR_EXATIDAO: "0.65"
        run: |
          curl -s -o nul http://localhost:11434/api/tags || (echo ERRO: o Ollama nao esta a correr nesta maquina & exit /b 1)
          rem --phoenix: cada deploy fica como experiência no Phoenix (dataset tesouraria-ambiguos-v2),
          rem com as métricas e os casos falhados ligados aos traces; o Phoenix do docker-compose
          rem está na porta 6006 do anfitrião. Sem Phoenix, avalia localmente na mesma
          docker run --rm --env-file .env -e LLM_FORNECEDOR=ollama -e OLLAMA_URL=http://host.docker.internal:11434/v1 -e OLLAMA_MODEL_ID=qwen2.5:3b -e PHOENIX_COLLECTOR_ENDPOINT=http://host.docker.internal:6006/v1/traces -e PHOENIX_URL_PUBLICA=http://localhost:6006 -e LANGSMITH_TRACING=false -e IMAGE_TAG=%IMAGE_TAG% %IMAGE_PREFIX%/api:%IMAGE_TAG% python -m app.evals.avaliar --estrategia hibrida --phoenix --limiar %LIMIAR_EXATIDAO%
      - name: Reiniciar containers
        run: docker compose up -d --no-build --remove-orphans
      - name: Limpar imagens antigas
        run: docker image prune -f
