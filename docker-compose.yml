services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tesouraria
      POSTGRES_PASSWORD: tesouraria
      POSTGRES_DB: tesouraria
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesouraria"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tesouraria:tesouraria@db:5432/tesouraria
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
