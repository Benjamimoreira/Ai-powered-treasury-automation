services:
  # Postgres 16 com a extensão pgvector (embeddings do histórico, para a
  # recuperação do RAG - ver docker/db/Dockerfile e app/services/indice_vetorial.py)
  db:
    build: ./docker/db
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/db:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_USER: tesouraria
      POSTGRES_PASSWORD: tesouraria
      POSTGRES_DB: tesouraria
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesouraria"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # image: publicada pelo GitHub Actions no GHCR (ver .github/workflows/ci.yml);
  # build: continua a permitir "docker compose up --build" localmente.
  api:
    build: .
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/api:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tesouraria:tesouraria@db:5432/tesouraria
      ONEDRIVE_RAIZ: /onedrive
      FORNECEDORES_RAIZ: /fornecedores
      # Caminho do Índice do Departamento Comercial *dentro* do container -
      # substitui o valor Windows de COMERCIAL_INDICE_PATH/CSV vindo do
      # .env (env_file, abaixo), que não existe dentro do container; a
      # pasta que o contém é montada como /comercial (ver volumes) a
      # partir de COMERCIAL_INDICE_RAIZ_DOCKER.
      COMERCIAL_INDICE_PATH: /comercial/${COMERCIAL_INDICE_NOME}
      # tracing das chamadas ao LLM (latência, tokens, custo) - ver serviço phoenix
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      # o mesmo Phoenix visto do browser, para os links da dashboard aos traces
      PHOENIX_URL_PUBLICA: ${PHOENIX_URL_PUBLICA:-http://localhost:6006}
      # LLM local: o Ollama corre no Windows, fora do Docker; o Docker Desktop
      # encaminha host.docker.internal para o 127.0.0.1 do anfitrião (não é
      # preciso abrir o Ollama à rede). Nenhum dado sai da máquina.
      LLM_FORNECEDOR: ollama
      OLLAMA_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL_ID: ${OLLAMA_MODEL_ID:-qwen2.5:3b}
    env_file:
      - .env
    volumes:
      - logs:/var/log/app
      - "${ONEDRIVE_RAIZ_DOCKER}:/onedrive:ro"
      - "${FORNECEDORES_RAIZ_DOCKER}:/fornecedores:ro"
      - "${COMERCIAL_INDICE_RAIZ_DOCKER}:/comercial:ro"
    command: >
      sh -c "python scripts/criar_tabelas.py &&
             (python scripts/indexar_embeddings.py >> /var/log/app/indexar_embeddings.log 2>&1 &) &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 2>&1 | tee /var/log/app/api.log"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/api:${IMAGE_TAG:-latest}
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    env_file:
      - .env
    volumes:
      - logs:/var/log/app
    command: >
      sh -c "streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 2>&1 | tee /var/log/app/dashboard.log"
    depends_on:
      - api
    restart: unless-stopped

  # Sincronização automática com o OneDrive: o mesmo que o botão "Atualizar
  # dados", de 15 em 15 min das 7h às 21h (ver app/sincronizador.py) - para
  # o extrato provisório das 14:00 e o final da manhã seguinte entrarem sem
  # ninguém carregar no botão. Mesma imagem da api; fala com ela pela rede.
  sincronizador:
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/api:${IMAGE_TAG:-latest}
    environment:
      API_BASE_URL: http://api:8000
      SYNC_INTERVALO_MINUTOS: ${SYNC_INTERVALO_MINUTOS:-15}
      SYNC_HORA_INICIO: ${SYNC_HORA_INICIO:-7}
      SYNC_HORA_FIM: ${SYNC_HORA_FIM:-21}
    command: python -m app.sincronizador
    depends_on:
      - api
    restart: unless-stopped

  # Tracing de LLMs (Arize Phoenix, open source): cada chamada ao LLM da api
  # fica registada com prompt, resposta, latência, tokens e custo estimado.
  # Um só container, e os traces não saem desta máquina (RGPD - ver
  # docs/GOVERNANCA_IA.md). UI em http://localhost:6006.
  phoenix:
    image: arizephoenix/phoenix:version-12.0.0
    ports:
      - "6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

  log-viewer:
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info

  # Lê os .log dos scripts agendados que correm fora do Docker (pasta
  # SCRIPTS_LOG_DIR no .env) e escreve-os no stdout deste container, para
  # aparecerem no Dozzle (log-viewer) junto dos logs da api/dashboard.
  scripts-log:
    image: busybox
    volumes:
      - "${SCRIPTS_LOG_DIR}:/logs:ro"
    command: sh -c "tail -F /logs/*.log"
    restart: unless-stopped

  # Mesma coisa que scripts-log, mas para os scripts de faturas (pasta
  # Fornecedores, fora do Docker) - pasta diferente, por isso mount à parte.
  scripts-log-faturas:
    image: busybox
    volumes:
      - "${SCRIPTS_LOG_DIR_FATURAS}:/logs:ro"
    command: sh -c "tail -F /logs/*.log"
    restart: unless-stopped

  # Junta diariamente os logs da api/dashboard e dos scripts agendados,
  # separa as linhas de erro e guarda tudo compactado por dia em /archive
  # (volume "logs_archive"), pronto a ser copiado/enviado para outra máquina.
  log-archiver:
    build: ./docker/log-archiver
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/log-archiver:${IMAGE_TAG:-latest}
    environment:
      TZ: Europe/Lisbon
    volumes:
      - logs:/logs-app:ro
      - "${SCRIPTS_LOG_DIR}:/logs-scripts:ro"
      - "${SCRIPTS_LOG_DIR_FATURAS}:/logs-scripts-faturas:ro"
      - logs_archive:/archive
    restart: unless-stopped

  # OCR de faturas de compras já arquivadas (não agendado - corre sob
  # pedido: "docker compose run --rm faturas-ocr"). Só este dos 3 scripts
  # de Fornecedores é containerizável: não depende do Outlook desktop
  # (COM), só de Tesseract/Poppler, disponíveis via apt em Linux. Reporta
  # a execução à API pela rede interna do Docker (http://api:8000).
  faturas-ocr:
    build: ./docker/faturas-ocr
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/faturas-ocr:${IMAGE_TAG:-latest}
    environment:
      ONEDRIVE_RAIZ: /onedrive
      API_TESOURARIA_URL: http://api:8000
    volumes:
      - "${ONEDRIVE_RAIZ_DOCKER}:/onedrive:ro"
      - faturas_extraidas:/output
    depends_on:
      - api

volumes:
  postgres_data:
  phoenix_data:
  logs:
  logs_archive:
  faturas_extraidas:
