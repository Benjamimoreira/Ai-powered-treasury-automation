# Servidor: só o dashboard, em contentor.
#
# A produção (BD, API, sincronizador, scripts do Windows e o agente que
# os lança/instala) fica no PC de produção, com o docker-compose.yml. Este
# dashboard fala com a API desse PC pela rede - incluindo o "Deploy dos
# scripts" da Monitorização, que o agente do Windows corre lá.
#
#   API_PRODUCAO_URL=http://<ip-do-pc-de-producao>:8000 \
#     docker compose -f docker-compose.dashboard.yml pull
#   API_PRODUCAO_URL=http://<ip-do-pc-de-producao>:8000 \
#     docker compose -f docker-compose.dashboard.yml up -d
#
# (ou API_PRODUCAO_URL no .env ao lado deste ficheiro). Ver docs/OPERACAO.md,
# "Dashboard no servidor".
name: tesouraria-dashboard

services:
  dashboard:
    image: ${IMAGE_PREFIX:-ghcr.io/benjamimoreira/ai-powered-treasury-automation}/api:${IMAGE_TAG:-latest}
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: ${API_PRODUCAO_URL:?define API_PRODUCAO_URL=http://<ip-do-pc-de-producao>:8000}
    env_file:
      - path: .env
        required: false
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped
